<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1427"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6"/>
  <!-- Neural Network Brain / Shield Shield Graphic -->
  <g transform="translate(106, 106)">
    <!-- Shield Outline -->
    <path d="M150 10 L280 60 L280 180 C280 250 180 300 150 310 C120 300 20 250 20 180 L20 60 Z" 
          fill="#131b31" stroke="#00f0ff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Synaptic Nodes -->
    <circle cx="150" cy="90" r="14" fill="#00f0ff"/>
    <circle cx="90" cy="150" r="12" fill="#8b5cf6"/>
    <circle cx="210" cy="150" r="12" fill="#8b5cf6"/>
    <circle cx="120" cy="220" r="10" fill="#38bdf8"/>
    <circle cx="180" cy="220" r="10" fill="#38bdf8"/>
    <circle cx="150" cy="260" r="8" fill="#a855f7"/>
    <!-- Synaptic Lines -->
    <line x1="150" y1="90" x2="90" y2="150" stroke="#00f0ff" stroke-width="4" opacity="0.8"/>
    <line x1="150" y1="90" x2="210" y2="150" stroke="#00f0ff" stroke-width="4" opacity="0.8"/>
    <line x1="90" y1="150" x2="120" y2="220" stroke="#8b5cf6" stroke-width="3" opacity="0.8"/>
    <line x1="210" y1="150" x2="180" y2="220" stroke="#8b5cf6" stroke-width="3" opacity="0.8"/>
    <line x1="90" y1="150" x2="210" y2="150" stroke="#8b5cf6" stroke-width="3" opacity="0.5"/>
    <line x1="120" y1="220" x2="150" y2="260" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
    <line x1="180" y1="220" x2="150" y2="260" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  </g>
</svg>
