# ====================================================================
# Fraud Detection System - Database Configuration
# Supports MySQL 8+, MariaDB, and H2 (Zero-setup Viva demonstration fallback)
# ====================================================================

# Active driver and database connection details
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/fraud_detection_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&connectTimeout=1000&socketTimeout=1000
db.username=root
db.password=root

# Fallback Configuration: Automatically engage embedded H2 in MySQL mode if MySQL server is unreachable
db.fallback.h2.enabled=true
db.fallback.h2.driver=org.h2.Driver
db.fallback.h2.url=jdbc:h2:mem:fraud_detection_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
db.fallback.h2.username=sa
db.fallback.h2.password=

# HikariCP Connection Pool Tuning
db.pool.maxPoolSize=10
db.pool.minIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=3000
db.pool.maxLifetime=1800000
